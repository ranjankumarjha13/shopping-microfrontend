<div class="login-page">

  <div class="login-card">

    <div class="login-brand">

      <div class="brand-icon">
        🛒
      </div>

      <div>
        <h1>ShopEase</h1>
        <span>Your Online Store</span>
      </div>

    </div>


    <div class="login-heading">

      <h2>Welcome Back</h2>

      <p>
        Login to continue shopping
      </p>

    </div>


    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label>
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          autocomplete="username"
        />

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          autocomplete="current-password"
        />

      </div>


      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>


      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >

        {{ loading
          ? 'Authenticating...'
          : 'Login'
        }}

      </button>

    </form>


    <div class="demo-login">

      <strong>
        Demo Credentials
      </strong>

      <div>
        Username: <b>ranjan</b>
      </div>

      <div>
        Password: <b>admin123</b>
      </div>

    </div>

  </div>

</div>
